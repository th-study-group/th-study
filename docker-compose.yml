services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: th-app
    env_file:
      - .env_docker
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./:/var/www
      - ./docker/php/conf.d/zz-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini
    depends_on:
      - mysql

  nginx:
    image: nginx:1.25-alpine
    container_name: th-nginx
    ports:
      - "8080:80"
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: th-mysql
    restart: unless-stopped
    env_file:
      - .env_docker
    environment:
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - th_mysql_data:/var/lib/mysql

  node:
    image: node:20-alpine
    container_name: th-node
    working_dir: /var/www
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./:/var/www
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  th_mysql_data:
