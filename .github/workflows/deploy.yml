name: th-study Laravel (Self-hosted)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on server
        shell: bash
        run: |
          set -e
          cd /var/www/th-study

          echo "==== Git Pull ===="
          git fetch --all
          git reset --hard origin/main

          echo "==== Composer Install ===="
          composer install --no-dev --optimize-autoloader

          echo "==== Docker Compose Up ===="
          docker compose up -d

          echo "==== Laravel Optimize ===="
          docker compose exec -T app php artisan optimize:clear || true
          docker compose exec -T app php artisan config:cache
          docker compose exec -T app php artisan route:cache || true
          docker compose exec -T app php artisan view:cache || true

          echo "==== DB Migrate ===="
          docker compose exec -T app php artisan migrate --force

          echo "==== Seed Note Master ===="
          docker compose exec -T app php artisan db:seed --class=NoteMasterSeeder --force

          echo "==== Permission Fix ===="
          sudo chown -R ubuntu:www-data storage bootstrap/cache || true
          sudo chmod -R 775 storage bootstrap/cache || true

          echo "==== Restart Services ===="
          sudo systemctl reload php8.2-fpm || true
          sudo systemctl reload nginx || true

          echo "==== Restart Queue ===="
          docker compose exec -T app php artisan queue:restart || true

          echo "🚀 Deployment Done!"
